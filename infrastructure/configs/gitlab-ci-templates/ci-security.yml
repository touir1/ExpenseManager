
.sca:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
    pull_policy: always
  artifacts:
    when: always
    paths:
      - trivy-report/
    expire_in: 1 week
  timeout: 30m
  variables:
    TRIVY_CACHE_DIR: "$BASE_DIR_PATH/.trivycache"
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: "$PROJECT_KEY-trivy-cache"
    paths:
      - $BASE_DIR_PATH/.trivycache/
  script:
    # Scan the repository for dependency vulnerabilities
    # vuln = SCA only; this avoids mixing in secrets/misconfiguration findings.
    - mkdir -p trivy-report
    - |
      if ! command -v jq >/dev/null 2>&1; then
        wget -q https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -O ./jq
        chmod +x ./jq
        export PATH="$PWD:$PATH"
      fi
    - |
      trivy fs \
        --scanners vuln \
        --format json \
        --output trivy-report/trivy-report.json \
        --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
        --exit-code 0 \
        .
    # Print vulnerability summary and details
    - |
      echo ""
      echo "========================================="
      echo "       TRIVY VULNERABILITY SCAN"
      echo "========================================="

      if [ -f trivy-report/trivy-report.json ]; then

        TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' \
          trivy-report/trivy-report.json)

        CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? |
          select(.Severity == "CRITICAL")] | length' \
          trivy-report/trivy-report.json)

        HIGH=$(jq '[.Results[]?.Vulnerabilities[]? |
          select(.Severity == "HIGH")] | length' \
          trivy-report/trivy-report.json)

        MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? |
          select(.Severity == "MEDIUM")] | length' \
          trivy-report/trivy-report.json)

        LOW=$(jq '[.Results[]?.Vulnerabilities[]? |
          select(.Severity == "LOW")] | length' \
          trivy-report/trivy-report.json)

        UNKNOWN=$(jq '[.Results[]?.Vulnerabilities[]? |
          select(.Severity == "UNKNOWN")] | length' \
          trivy-report/trivy-report.json)

        echo "🔴 CRITICAL: $CRITICAL"
        echo "🟠 HIGH:     $HIGH"
        echo "🟡 MEDIUM:   $MEDIUM"
        echo "🟢 LOW:      $LOW"
        echo "⚪ UNKNOWN:  $UNKNOWN"
        echo "📊 TOTAL:    $TOTAL"

        echo "========================================="
        echo ""

        if [ "$TOTAL" != "0" ]; then
          echo "📋 VULNERABILITY DETAILS:"
          echo ""

          jq -r '
            .Results[]? |
            select(.Vulnerabilities) |
            .Target as $target |
            .Vulnerabilities[] |
            "[\(.Severity)] \(.VulnerabilityID) - \(.PkgName)\n" +
            "  Target: \($target)\n" +
            "  Installed: \(.InstalledVersion)\n" +
            "  Fixed: \(.FixedVersion // "Not specified")\n" +
            "  Score: \(.CVSS.nvd.V3Score // .CVSS.redhat.V3Score // "N/A")\n" +
            "  Title: \(.Title // "N/A")\n"
          ' trivy-report/trivy-report.json 2>/dev/null ||
            echo "Unable to parse vulnerability details"
        else
          echo "✅ No vulnerabilities found!"
        fi
      else
        echo "⚠️ No report generated"
      fi

      echo "========================================="
    # Fail the pipeline for HIGH / CRITICAL vulnerabilities (reuses the scan above, no second trivy run)
    - |
      if [ -f trivy-report/trivy-report.json ]; then
        FAIL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? |
          select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' \
          trivy-report/trivy-report.json)
        if [ "$FAIL_COUNT" != "0" ]; then
          echo "❌ Found $FAIL_COUNT HIGH/CRITICAL vulnerabilities"
          exit 1
        fi
      fi

.sast:
  stage: security
  image: returntocorp/semgrep
  script:
    - ln -sf "$PWD" /src
    - semgrep scan --config=p/csharp --json --metrics=off --output semgrep.json --verbose .
  artifacts:
    when: always
    paths:
      - $BASE_DIR_PATH/semgrep.json

.secrets-scan:
  stage: security
  image: 
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git -c ../../.gitleaks.toml --report-format json --report-path gitleaks.json --verbose --platform gitlab
  artifacts:
    when: always
    paths:
      - $BASE_DIR_PATH/gitleaks.json